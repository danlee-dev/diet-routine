<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>6kg 감량 루틴</title>
<meta name="description" content="한 달 6kg 감량을 위한 하루 식단 순서, 상황별 대처, 기록, 홈트와 장보기">
<meta name="theme-color" content="#FCFCFC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0A0A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="감량 루틴">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=Inter+Tight:wght@300;400;500;600&display=swap">
<style>
/* Layout: phone = app shell (bottom tabs, sheets, full-screen workout); tablet = top segmented nav, 2-col views; desktop = left rail with live summary, 2-col today with log + situation panel */
:root{
  --bg:#FCFCFC; --surface:#F3F3F3; --surface-2:#E8E8E8; --line:#E2E2E2; --ctrl:#C9C9C9;
  --fg:#0B0B0B; --fg-2:#3A3A3A; --muted:#6B6B6B; --on-fg:#FFFFFF;
  --orb-1:#FF7A45; --orb-2:#FF4F6D; --orb-3:#FFB37A; --orb-4:#FFE6D0;
  --scrim:rgba(0,0,0,.36);
  --font-display:"Inter Tight","IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --font-body:"IBM Plex Sans KR","Inter Tight",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --r-xs:10px; --r-sm:14px; --r-md:20px; --r-lg:26px; --r-xl:32px;
  --spring:cubic-bezier(.32,.72,0,1);
  --tab-h:62px;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A0A; --surface:#171717; --surface-2:#262626; --line:#262626; --ctrl:#4A4A4A;
    --fg:#F2F2F2; --fg-2:#CFCFCF; --muted:#9B9B9B; --on-fg:#0A0A0A;
    --orb-1:#F0743F; --orb-2:#E24C68; --orb-3:#D88C55; --orb-4:#5E3E2C;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#171717; --surface-2:#262626; --line:#262626; --ctrl:#4A4A4A;
  --fg:#F2F2F2; --fg-2:#CFCFCF; --muted:#9B9B9B; --on-fg:#0A0A0A;
  --orb-1:#F0743F; --orb-2:#E24C68; --orb-3:#D88C55; --orb-4:#5E3E2C;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
@supports (corner-shape: squircle){
  :root{ --r-xs:14px; --r-sm:20px; --r-md:28px; --r-lg:36px; --r-xl:44px; }
  .sq{ corner-shape:squircle; }
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;scrollbar-gutter:stable}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
a{color:inherit;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
ul{margin:0;padding:0;list-style:none}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
::selection{background:var(--fg);color:var(--on-fg)}
@supports (scrollbar-color: auto){ html,.sheet,.side,textarea.input{scrollbar-width:thin;scrollbar-color:var(--ctrl) transparent} }
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ctrl);border-radius:12px;border:4px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background-color:var(--muted)}
svg.lucide{width:20px;height:20px;stroke-width:1.75;flex:none}
.num{font-family:var(--font-display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.04em;color:var(--muted);font-weight:500}
.pill{border-radius:999px}
.input{-webkit-appearance:none;appearance:none;height:46px;min-width:0;border-radius:var(--r-sm);border:1px solid var(--ctrl);background:var(--bg);color:var(--fg);caret-color:var(--fg);padding:0 14px;font:inherit;font-size:16px;font-variant-numeric:tabular-nums;transition:border-color .2s}
.input::placeholder{color:var(--muted);opacity:1}
.input:focus{outline:none;border-color:var(--fg)}
textarea.input{display:block;height:120px;padding:12px 14px;font-size:16px;line-height:1.45;resize:none;width:100%;font-family:ui-monospace,Menlo,monospace;word-break:break-all}
@media (hover:hover) and (pointer:fine){ textarea.input{font-size:13px} }

/* ---------- custom pickers (replace native time / number inputs) ---------- */
.wake-acts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sheet-acts{display:flex;gap:8px;margin-top:20px}
.sheet-acts .btn-primary,.sheet-acts .btn-ghost{height:50px;justify-content:center;font-size:16px;white-space:nowrap}
.sheet-acts .btn-primary{flex:1 1 auto;padding:0 20px}
.sheet-acts .btn-ghost{flex:0 0 auto;padding:0 20px}
.picker{--ih:46px;position:relative;display:flex;justify-content:center;height:calc(var(--ih) * 5);margin-top:18px;isolation:isolate}
.picker-band{position:absolute;z-index:-1;left:0;right:0;top:calc(var(--ih) * 2);height:var(--ih);border-radius:var(--r-sm);background:var(--surface)}
.wheel{flex:0 0 78px;height:100%;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y mandatory;scrollbar-width:none;outline:none;touch-action:pan-y;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 66%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 34%,#000 66%,transparent 100%)}
.wheel.sm{flex-basis:54px}
.wheel::-webkit-scrollbar{display:none}
.wheel-pad{height:calc(var(--ih) * 2)}
.wheel-item{height:var(--ih);display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-family:var(--font-display);font-size:25px;font-weight:300;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;-webkit-user-select:none;user-select:none;transition:color .15s}
.wheel-item.on{color:var(--fg);font-weight:400}
.wheel:focus-visible .wheel-item.on{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:7px}
.picker-unit{display:flex;align-items:center;padding:0 12px 0 0;font-size:15px;font-weight:500;color:var(--fg-2);pointer-events:none}
.picker-dot{display:flex;align-items:center;font-family:var(--font-display);font-size:25px;color:var(--fg);pointer-events:none;margin:0 -2px}
.pick-plan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;margin-top:16px}
.pick-plan div{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 4px;border-radius:var(--r-sm);background:var(--surface)}
.pick-plan span{font-size:12px;color:var(--muted)}
.pick-plan b{font-family:var(--font-display);font-weight:500;font-size:16px;font-variant-numeric:tabular-nums}
.pick-note{margin-top:14px;text-align:center;font-size:13.5px;color:var(--muted);min-height:21px}
.pick-note b{color:var(--fg);font-weight:600;font-variant-numeric:tabular-nums}
.pad-display{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:14px}
.pad-display b{font-family:var(--font-display);font-weight:300;font-size:54px;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums;transition:color .2s}
.pad-display b.fresh{color:var(--muted)}
.pad-display small{font-size:16px;color:var(--muted)}
.quick{display:flex;justify-content:center;gap:6px;margin-top:12px}
.quick button{height:34px;padding:0 13px;border-radius:999px;background:var(--surface);font-size:13.5px;font-weight:500;font-variant-numeric:tabular-nums;transition:background .15s,transform .2s var(--spring)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.keypad button{display:grid;place-items:center;height:56px;border-radius:var(--r-md);background:var(--surface);font-family:var(--font-display);font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;transition:background .15s,transform .2s var(--spring)}
.keypad button.fn{font-family:var(--font-body);font-size:15px;font-weight:500;color:var(--fg-2)}
.keypad svg.lucide{width:24px;height:24px}
.keypad button:active,.quick button:active{transform:scale(.95);background:var(--surface-2)}
@media (hover:hover){ .keypad button:hover,.quick button:hover{background:var(--surface-2)} }
@media (max-height:720px){ .keypad button{height:48px} .keypad{gap:6px} .pad-display b{font-size:44px} .sheet .sheet-head .now-title{font-size:28px} }
.field-row{display:flex;align-items:center;gap:10px;width:100%;margin-top:4px;padding:14px 0 6px;border-top:1px solid var(--line);text-align:left;font-size:15px}
.field-row .lbl{flex:1}
.field-row .num{font-size:17px}
.field-row .muted{color:var(--muted);font-size:14px}
.field-row svg.lucide{width:18px;height:18px;color:var(--muted)}
.form-msg{margin-top:10px;font-size:13px;color:var(--fg-2);min-height:20px}

/* ---------- shell ---------- */
.app{min-height:100dvh}
.side,.topnav{display:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 28px)}
.view{display:none}
.view.is-active{display:block}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));
  background:var(--bg);border-top:1px solid var(--line)}
@supports (backdrop-filter: blur(1px)){ .tabbar{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:saturate(1.6) blur(20px);-webkit-backdrop-filter:saturate(1.6) blur(20px)} }
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;font-size:11px;color:var(--muted);font-weight:500;transition:color .2s}
.tab svg.lucide{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"] svg.lucide{stroke-width:2.1}

/* ---------- headings ---------- */
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:18px}
.page-title{font-family:var(--font-display);font-weight:300;font-size:clamp(30px,8vw,44px);line-height:1.08;letter-spacing:-.025em;text-wrap:balance}
.page-sub{color:var(--muted);font-size:14px}
.section-title{font-size:13px;font-weight:600;color:var(--fg-2);margin:28px 0 12px;letter-spacing:.01em}
.clockline{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.clockline b{color:var(--fg);font-weight:600}
.link-btn{display:inline-flex;align-items:center;gap:3px;font-size:13px;font-weight:600;color:var(--fg);white-space:nowrap}
.link-btn svg.lucide{width:15px;height:15px}

/* ---------- summary ---------- */
.sum{display:flex;align-items:center;gap:14px}
.orb{--size:56px;--pct:0;position:relative;width:var(--size);height:var(--size);border-radius:50%;overflow:hidden;isolation:isolate;flex:none;
  transform:scale(calc(.84 + var(--pct)*.16));transition:transform .7s var(--spring)}
.orb::before{content:"";position:absolute;inset:-25%;
  background:radial-gradient(38% 38% at 28% 30%, var(--orb-4), transparent 70%),radial-gradient(48% 48% at 72% 32%, var(--orb-2), transparent 72%),radial-gradient(58% 58% at 38% 76%, var(--orb-1), transparent 72%),radial-gradient(64% 64% at 82% 82%, var(--orb-3), transparent 72%),var(--orb-3);
  filter:blur(5px) saturate(calc(.55 + var(--pct)*.7));transition:filter .7s}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 28%, rgba(255,255,255,.5), transparent 46%)}
.sum-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.sum-k{font-family:var(--font-display);font-size:20px;font-weight:400;letter-spacing:-.02em}
.sum-k small{font-size:13px;color:var(--muted);font-weight:400;margin-left:2px}
.sum-p{font-size:13px;color:var(--muted)}
.segs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;margin-top:8px}
.segs span{height:4px;border-radius:4px;background:var(--surface-2);transition:background .35s var(--spring)}
.segs span.on{background:var(--fg)}

/* ---------- chips ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-inline:max(16px,env(safe-area-inset-left,0px));margin:0 calc(-1*max(16px,env(safe-area-inset-right,0px))) 0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:2px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start;flex:none;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px 0 12px;border-radius:999px;background:var(--surface);color:var(--fg-2);font-size:14px;font-weight:500;white-space:nowrap;transition:background .25s,color .25s,transform .25s var(--spring)}
.chip svg.lucide{width:17px;height:17px}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--on-fg)}
.scen-banner{display:flex;align-items:center;gap:12px;margin-top:10px;padding:12px 14px;border-radius:var(--r-md);background:var(--surface)}
.scen-banner p{flex:1;min-width:0;font-size:14px;color:var(--fg-2)}
.scen-banner p b{color:var(--fg);font-weight:600}

/* ---------- wake + due ---------- */
.wake,.due{display:flex;flex-direction:column;gap:12px;margin-top:16px;padding:18px;border-radius:var(--r-lg);background:var(--surface)}
.wake h3{font-size:17px;font-weight:600;letter-spacing:-.01em}
.wake p{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .input{flex:1 1 120px}
.mini-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 16px;border-radius:999px;background:var(--fg);color:var(--on-fg);font-weight:500;font-size:14.5px;white-space:nowrap;transition:transform .25s var(--spring)}
.mini-btn:active{transform:scale(.96)}
.mini-btn svg.lucide{width:17px;height:17px}
.mini-btn.ghost{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.due-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}

/* ---------- now card ---------- */
.now{position:relative;overflow:hidden;margin-top:16px;padding:20px 20px 18px;border-radius:var(--r-xl);background:var(--surface);isolation:isolate}
.now-orb{position:absolute;z-index:-1;width:132px;height:132px;right:-36px;top:-50px;border-radius:50%;overflow:hidden;opacity:.95}
.now-orb::before{content:"";position:absolute;inset:-25%;
  background:radial-gradient(40% 40% at 30% 30%, var(--orb-4), transparent 70%),radial-gradient(50% 50% at 70% 35%, var(--orb-2), transparent 72%),radial-gradient(60% 60% at 40% 75%, var(--orb-1), transparent 72%),var(--orb-3);
  filter:blur(8px)}
.now-title{font-family:var(--font-display);font-weight:300;font-size:34px;letter-spacing:-.03em;line-height:1.1;margin-top:6px}
.now-rel{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--fg)}
.now-items{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.now-items li{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.amt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.now-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}
.now-num{font-size:13px;color:var(--muted)}
.btn-primary{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px 0 16px;background:var(--fg);color:var(--on-fg);font-size:15px;font-weight:500;transition:transform .25s var(--spring),opacity .2s}
.btn-primary:active{transform:scale(.96)}
.btn-primary svg.lucide{width:18px;height:18px;stroke-width:2.2}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:500;transition:background .2s,transform .25s var(--spring)}
.btn-ghost:active{transform:scale(.97)}
.btn-ghost svg.lucide{width:16px;height:16px}
.now.done .now-title{font-size:28px}
.now.done p.now-sub{margin-top:8px;color:var(--fg-2);font-size:14px}

/* ---------- timeline ---------- */
.meals{display:flex;flex-direction:column;gap:2px}
.meal{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:10px 4px 10px 0;border-radius:var(--r-md);transition:opacity .35s}
.meal-main{display:flex;align-items:center;gap:12px;text-align:left;min-width:0;padding:4px 0}
.tile{display:grid;place-items:center;width:44px;height:44px;border-radius:var(--r-sm);background:var(--surface);flex:none;transition:background .3s}
.meal-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.meal-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.meal-name{font-size:16px;font-weight:600}
.meal-time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.meal-items{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meal-detail{display:none}
.meal-side{display:flex;align-items:center;gap:14px}
.kcal{display:none;font-family:var(--font-display);font-size:15px;color:var(--fg-2);white-space:nowrap}
.kcal small{color:var(--muted);font-size:12px;margin-left:2px}
.check{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--ctrl);color:transparent;transition:background .3s var(--spring),border-color .3s,color .2s}
.check svg.lucide{width:20px;height:20px;stroke-width:2.4}
.check[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--on-fg)}
.meal.is-done .meal-text,.meal.is-done .meal-detail{opacity:.42}
.meal.is-done .meal-name{text-decoration:line-through;text-decoration-thickness:1.5px}
.meal.is-next .tile{background:var(--fg);color:var(--on-fg)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:10px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.total b{font-family:var(--font-display);font-weight:400;color:var(--fg);font-size:17px}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- log tiles ---------- */
.log{display:grid;gap:10px}
.log-tile{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--r-lg);background:var(--surface)}
.log-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.log-top .val b{font-family:var(--font-display);font-size:22px;font-weight:400;letter-spacing:-.02em}
.log-top .val small{font-size:13px;color:var(--muted);margin-left:3px}
.cups{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.cups button{height:30px;border-radius:9px;background:var(--surface-2);transition:background .25s var(--spring),transform .25s var(--spring)}
.cups button.on{background:var(--fg)}
.cups button:active{transform:scale(.9)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);border-radius:6px;transition:width .6s var(--spring)}
.delta{font-size:13px;color:var(--muted)}

/* ---------- rules / keep ---------- */
.rules{display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:10px;font-size:14.5px;color:var(--fg-2)}
.rules li svg.lucide{width:18px;height:18px;margin-top:2px;color:var(--fg)}
.rules.dots li::before{content:"";flex:none;width:5px;height:5px;border-radius:50%;background:var(--fg);margin-top:9px}
.box{padding:18px;border-radius:var(--r-lg);background:var(--surface)}
.keep{display:grid;gap:10px}
.keep-item{display:flex;gap:12px;align-items:flex-start;font-size:14.5px}

/* ---------- segmented ---------- */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;background:var(--surface);gap:2px}
.seg button{height:36px;border-radius:999px;font-size:14px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .3s var(--spring),color .2s,box-shadow .3s}

.box .seg button[aria-pressed="true"]{background:var(--surface-2)}

/* ---------- situations ---------- */
.cards{display:grid;gap:12px}
.card{display:flex;flex-direction:column;gap:14px;padding:18px;border-radius:var(--r-lg);background:var(--surface)}
.card-head{display:flex;align-items:center;gap:12px}

.card-head p{font-size:13px;color:var(--muted)}
.card .btn-ghost{align-self:flex-start;margin-top:auto}
.card.is-current{background:var(--fg);color:var(--on-fg)}
.card.is-current .rules li,.card.is-current .card-head p{color:color-mix(in srgb,var(--on-fg) 78%,transparent)}
.card.is-current .rules.dots li::before{background:var(--on-fg)}

.card.is-current .btn-ghost{background:transparent;border-color:color-mix(in srgb,var(--on-fg) 30%,transparent);color:var(--on-fg)}

/* ---------- shop ---------- */
.shop-cols{display:grid;gap:22px;margin-top:16px}
.shop-col.is-off{display:none}
.shop-col h3{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:600;margin-bottom:8px}
.shop-col h3 span{font-family:var(--font-display);font-weight:400;color:var(--muted);font-size:14px}
.shop-list{display:flex;flex-direction:column}
.shop-item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.shop-item:last-child{border-bottom:0}
.cb{width:26px;height:26px;border-radius:8px;border:1.5px solid var(--ctrl);display:grid;place-items:center;color:transparent;transition:background .25s var(--spring),border-color .25s,color .2s}
.cb svg.lucide{width:16px;height:16px;stroke-width:2.6}
.cb[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--on-fg)}
.shop-name{font-size:14.5px;font-weight:500;line-height:1.35}
.shop-meta{font-size:13px;color:var(--muted);margin-top:2px}

.go{display:inline-flex;align-items:center;gap:4px;height:34px;padding:0 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;transition:background .2s}

.dday{font-family:var(--font-display);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--fg-2);white-space:nowrap}
.dday.is-due{background:var(--fg);color:var(--on-fg)}
.shop-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted)}

/* ---------- workout ---------- */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:var(--r-sm);background:var(--bg);font-size:12px;color:var(--muted)}

.routine{display:flex;flex-direction:column}
.routine li{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.routine li:last-child{border-bottom:0}
.big{font-family:var(--font-display);font-weight:300;font-size:44px;letter-spacing:-.03em;line-height:1}
.big small{font-size:16px;color:var(--muted);margin-left:4px;font-weight:400}
.wo-grid,.rec-grid{display:grid;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.done-tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.done-tag svg.lucide{width:16px;height:16px;stroke-width:2.4}

/* ---------- records ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:var(--r-md);background:var(--bg)}
.stat b{font-family:var(--font-display);font-weight:400;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto}
.chart .band{fill:var(--surface-2)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tl{stroke:var(--ctrl);stroke-width:1;stroke-dasharray:3 4}
.chart .wl{fill:none;stroke:var(--fg);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .al{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 5}
.chart .pt{fill:var(--fg)}
.chart .lb{fill:var(--muted);font-size:14px;font-family:var(--font-body)}
.chart .em{fill:var(--muted);font-size:13px;font-family:var(--font-body)}
@media (max-width:767px){ .chart .lb{font-size:20px} .chart .em{font-size:22px} .chart .wl{stroke-width:3.6} .chart .al{stroke-width:2.6} .chart .gl,.chart .tl{stroke-width:1.6} }
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;background:var(--fg)}
.legend i.a{background:none;border-top:2px dashed var(--muted);height:0}
.legend i.b{height:10px;background:var(--surface-2);border-radius:3px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-h{font-size:11.5px;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:4px;min-height:58px;padding:7px 7px 8px;border-radius:var(--r-sm);background:var(--bg);text-align:left;font-size:12px;transition:transform .25s var(--spring)}
.cell:active{transform:scale(.95)}
.cell .d{font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.cell .w{font-family:var(--font-display);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cell .mb{height:4px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.cell .mb i{display:block;height:100%;background:var(--fg)}
.cell .wk{position:absolute;top:6px;right:6px;width:14px;height:14px}
.cell.is-today{background:var(--fg);color:var(--on-fg)}
.cell.is-today .w{color:color-mix(in srgb,var(--on-fg) 70%,transparent)}
.cell.is-today .mb{background:color-mix(in srgb,var(--on-fg) 25%,transparent)}
.cell.is-today .mb i{background:var(--on-fg)}
.cell.is-future{opacity:.42;pointer-events:none}

/* ---------- sheet / modal ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;touch-action:none}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:88dvh;overflow:auto;overscroll-behavior:contain;background:var(--bg);
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(104%);visibility:hidden;transition:transform .48s var(--spring),visibility 0s linear .48s}
.sheet.open{transform:none;visibility:visible;transition:transform .48s var(--spring),visibility 0s}
.grab{width:38px;height:5px;border-radius:999px;background:var(--surface-2);margin:0 auto 14px}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.icon-btn{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--surface);flex:none}

.sheet .stat-row div{display:flex;flex-direction:column}

.sheet .stat-row span{font-size:12.5px;color:var(--muted)}
.sheet .swaps{margin-top:18px;padding:14px;border-radius:var(--r-md);background:var(--surface)}
.sheet .wide-btn{width:100%;justify-content:center;height:50px;margin-top:20px;font-size:16px}

.sheet .toggles li:last-child{border-bottom:0}

.swap svg.lucide{width:16px;height:16px;margin-top:2px}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 14px);z-index:55;display:flex;align-items:center;gap:14px;max-width:calc(100vw - 32px);padding:8px 8px 8px 18px;border-radius:999px;background:var(--fg);color:var(--on-fg);font-size:14px;
  opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .3s,transform .4s var(--spring)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
html.locked .toast{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-16px)}
html.locked .toast.show{transform:translate(-50%,0)}
.toast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast button{height:34px;padding:0 14px;border-radius:999px;background:color-mix(in srgb,var(--on-fg) 16%,transparent);font-weight:600;font-size:13px;white-space:nowrap}

/* ---------- workout player ---------- */
.wo{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--bg);
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(20px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(100%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s linear .5s}
.wo.open{transform:none;visibility:visible;transition:transform .5s var(--spring),visibility 0s}
.wo-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wo-head .t{font-weight:600;font-size:15px}
.wo-head .acts{display:flex;gap:8px}
.wo-body{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;padding:20px 0;min-height:0}
.wo-name{font-family:var(--font-display);font-weight:300;font-size:clamp(36px,10vw,52px);letter-spacing:-.03em;line-height:1.1}
.wo-n{font-family:var(--font-display);font-weight:300;font-size:clamp(84px,26vw,120px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.wo-n small{font-size:22px;color:var(--muted);margin-left:6px;letter-spacing:0}
.wo-steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;width:min(320px,100%)}
.wo-steps span{height:4px;border-radius:4px;background:var(--surface-2)}
.wo-steps span.on{background:var(--fg)}
.wo-next{font-size:14px;color:var(--muted)}
.wo-foot{display:flex;flex-direction:column;gap:10px}
.wo-foot .btn-primary{height:56px;justify-content:center;font-size:17px;width:100%}
.wo-foot .row{justify-content:center}
.ring{width:min(240px,62vw);height:auto}
.ring .bg{fill:none;stroke:var(--surface-2);stroke-width:10}
.ring .fg{fill:none;stroke:var(--fg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.ring text{fill:var(--fg);font-family:var(--font-display);font-weight:300;font-size:64px}

/* ---------- motion ---------- */
@media (prefers-reduced-motion: no-preference){
  .view.is-active{animation:viewIn .45s var(--spring) both}
  .stagger > *{animation:rise .55s var(--spring) both;animation-delay:calc(var(--i,0) * 45ms)}
  .now-orb::before,.orb::before{animation:drift 24s linear infinite}
  .pop{animation:pop .42s var(--spring)}
  .now.swap-in{animation:swapIn .5s var(--spring)}
  .wo-body.enter{animation:swapIn .45s var(--spring)}
  .sheet-body.is-swap{animation:swapIn .4s var(--spring)}
}
@keyframes viewIn{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes drift{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.78)}55%{transform:scale(1.1)}100%{transform:scale(1)}}

/* ================= schedule ================= */
function schedule(wake){
  if(wake==null) return null;
  const r=x=>Math.round(x/10)*10;
  const b=wake+30, total=540;
  let d=19*60, span=d-b;
  if(span<total){ d=19*60+30; span=d-b; }
  if(span<90){ d=b+90; span=90; }
  const merge=span<360;
  let k=span/total;
  if(k>1.35){ k=1.35; d=b+total*k; }
  let L,S;
  if(merge){ L=b+span/2; S=b; } else { L=b+210*k; S=L+180*k; }
  return {b:r(b),l:r(L),s:r(S),d:r(d),merge,workout:merge?null:r(S+60)};
}
function plan(){
  const s=SCEN[state.scen], sch=schedule(state.wake);
  return ORDER.map(k=>{
    let m=Object.assign({key:k},MEALS[k]);
    const o=s.over&&s.over[k]; if(o) m=Object.assign(m,o);
    if(state.scen==='eatout'&&k===state.eatout) m=Object.assign(m,EATOUT(k));
    if(sch){
      if(k==='breakfast'){ m.at=sch.b; if(sch.merge) m.hint='늦게 일어난 날: 간식 닭가슴살을 첫 끼에 같이 먹습니다'; }
      if(k==='lunch') m.at=sch.l;
      if(k==='snack'){ m.at=sch.s; if(sch.merge) m.time='첫 끼에 같이'; }
      if(k==='dinner') m.at=(state.scen==='lateHome')?19*60:sch.d;
      if(k==='post'){
        if(state.scen==='rest') m.at=sch.s;
        else if(state.scen!=='lateHome'&&sch.workout) m.hint='추천 홈트 시간 '+hhmm(sch.workout)+'쯤';
      }
    }
    return m;
  });
}
function summary(p){
  let tot=0,totp=0,k=0,pr=0,c=0;
  p.forEach(m=>{tot+=m.kcal;totp+=m.p;if(state.checks.has(m.key)){k+=m.kcal;pr+=m.p;c++}});
  return {tot,totp,k,p:pr,c,n:p.length,pct:tot?k/tot:0};
}
const timeLabel=m=>m.at!=null?hhmm(m.at)+'쯤':m.time;
function relText(at){
  const diff=at-nowMin();
  if(diff>10) return durText(diff)+' 뒤';
  if(diff>=-60) return '지금 먹을 시간';
  return durText(-diff)+' 지났어요 · 지금 먹어도 됩니다';
}
function deadlineText(){
  const left=20*60-nowMin();
  return left>0?'저녁 마감 <b>20:00</b>까지 '+durText(left):'저녁 마감이 지났어요 · 물, 아메리카노만';
}

    if(di<=dayIdx+1&&di>=dayIdx-5) out.push({id,name:c.name,url:c.url,diff:di-dayIdx});
  }));
  if(dow===1) out.push({id:'weekly@'+dayKey,name:'매주 장보기 (요거트, 샐러드 4개, 토마토, 우유)',nav:'shop',diff:0});
  if(dow===4) out.push({id:'salad@'+dayKey,name:'샐러드 3개 (금~일 분)',url:URL.salad,diff:0});
  return out.filter(x=>!state.cycle.has(x.id));
}

function series(){

  for(let i=0;i<Math.min(PLAN_DAYS,Math.max(1,dayIdx+1));i++){ const w=weightOf(keyOf(addDays(START,i))); if(w!=null) out.push({i,w}); }
  return out;
}
function chartHTML(){
  const W=600,H=250,pl=34,pr=14,pt=14,pb=28,xmax=PLAN_DAYS-1;
  const data=series();
  let ymin=69,ymax=77; data.forEach(p=>{ymin=Math.min(ymin,Math.floor(p.w-.5));ymax=Math.max(ymax,Math.ceil(p.w+.5))});
  const x=i=>pl+(W-pl-pr)*i/xmax, y=v=>pt+(H-pt-pb)*(ymax-v)/(ymax-ymin);
  const up=[[0,76],[7,74],[14,73],[21,72],[28,71],[29,71]], lo=[[0,76],[7,73.5],[14,72.5],[21,71.5],[28,70],[29,70]];
  const band='M'+up.map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' L')+' L'+lo.slice().reverse().map(p=>x(p[0]).toFixed(1)+','+y(p[1]).toFixed(1)).join(' L')+' Z';
  let g='';
  for(let v=Math.ceil(ymin);v<=ymax;v++){ if(v%2) continue; g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text class="lb" x="${pl-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${v}</text>`; }
  [0,7,14,21,28].forEach(i=>{ g+=`<text class="lb" x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle">${md(addDays(START,i))}</text>`; });
  let tl='';
  if(dayIdx>=0&&dayIdx<=xmax) tl=`<line class="tl" x1="${x(dayIdx).toFixed(1)}" x2="${x(dayIdx).toFixed(1)}" y1="${pt}" y2="${H-pb}"/>`;
  let wl='',al='',pts='';
  if(data.length){
    wl=`<path class="wl" d="M${data.map(p=>x(p.i).toFixed(1)+','+y(p.w).toFixed(1)).join(' L')}"/>`;
    const avg=data.map(p=>{const win=data.filter(q=>q.i<=p.i&&q.i>p.i-7);return {i:p.i,w:win.reduce((a,q)=>a+q.w,0)/win.length}});
    if(avg.length>1) al=`<path class="al" d="M${avg.map(p=>x(p.i).toFixed(1)+','+y(p.w).toFixed(1)).join(' L')}"/>`;
    pts=data.map(p=>`<circle class="pt" cx="${x(p.i).toFixed(1)}" cy="${y(p.w).toFixed(1)}" r="${(mqPhone.matches?6:3.5)*(data.length>20?.75:1)}"/>`).join('');
  }
  const empty=data.length?'':`<text class="em" x="${W/2}" y="${H/2}" text-anchor="middle">아침 체중을 넣으면 여기에 선이 그려집니다</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="30일 체중 그래프"><path class="band" d="${band}"/>${g}${tl}${al}${wl}${pts}${empty}</svg>`;
}
function weightStats(){
  const data=series(); const last=data.length?data[data.length-1].w:null;
  let proj=null;
  if(data.length>=5){
    const n=data.length, sx=data.reduce((a,p)=>a+p.i,0), sy=data.reduce((a,p)=>a+p.w,0), sxx=data.reduce((a,p)=>a+p.i*p.i,0), sxy=data.reduce((a,p)=>a+p.i*p.w,0);
    const b=(n*sxy-sx*sy)/(n*sxx-sx*sx), a=(sy-b*sx)/n; proj=a+b*(PLAN_DAYS-1);
  }
  return {last,proj,count:data.length};
}
function dayInfo(i){
  const d=addDays(START,i), k=keyOf(d);
  const ch=k===dayKey?Array.from(state.checks):store.get(K.checks(k),[]);
  return {d,k,meals:ch.length,checks:ch,w:weightOf(k),wo:store.get(K.workout(k),null),water:k===dayKey?state.water:store.get(K.water(k),0),steps:k===dayKey?state.steps:store.get(K.steps(k),0)};
}
function streaks(){
  let streak=0;
  for(let i=dayIdx;i>=0;i--){ const n=dayInfo(i).meals; if(n>=4) streak++; else if(i===dayIdx) continue; else break; }
  let wo=0; for(let i=0;i<=Math.min(dayIdx,PLAN_DAYS-1);i++) if(dayInfo(i).wo) wo++;
  return {streak,wo};

/* ================= wheel picker + keypad (custom replacements for native time/number inputs) ================= */
const IH=46, reduceMotion=matchMedia('(prefers-reduced-motion: reduce)');
const wheelHTML=(id,items,label,cls)=>`<div class="wheel${cls?' '+cls:''}" id="${id}" tabindex="0" role="spinbutton" aria-label="${label}" aria-valuemin="${items[0].v}" aria-valuemax="${items[items.length-1].v}"><div class="wheel-pad"></div>${items.map((x,i)=>`<div class="wheel-item" data-wi="${i}">${x.t}</div>`).join('')}<div class="wheel-pad"></div></div>`;
function mountWheel(el,items,start,onChange){
  const kids=el.querySelectorAll('.wheel-item'), last=items.length-1, w={idx:-1,raf:0};
  const clamp=i=>Math.max(0,Math.min(last,i));
  const paint=()=>{
    w.raf=0; const c=el.scrollTop/IH, i=clamp(Math.round(c));
    for(let k=clamp(Math.floor(c)-3);k<=clamp(Math.ceil(c)+3);k++){ const a=Math.min(Math.abs(k-c),3); kids[k].style.transform='scale('+(1-a*.08).toFixed(3)+')'; }
    if(i!==w.idx){
      if(w.idx>=0) kids[w.idx].classList.remove('on'); kids[i].classList.add('on'); w.idx=i;
      el.setAttribute('aria-valuenow',items[i].v); el.setAttribute('aria-valuetext',items[i].a||items[i].t);
      if(onChange) onChange();
    }
  };
  w.set=(i,smooth)=>{ i=clamp(i); if(smooth&&!reduceMotion.matches&&el.scrollTo) el.scrollTo({top:i*IH,behavior:'smooth'}); else { el.scrollTop=i*IH; paint(); } };
  w.val=()=>items[w.idx].v;
  el.addEventListener('scroll',()=>{ if(!w.raf) w.raf=requestAnimationFrame(paint); },{passive:true});
  el.addEventListener('click',e=>{ const it=e.target.closest('.wheel-item'); if(it) w.set(+it.getAttribute('data-wi'),true); });
  el.addEventListener('keydown',e=>{
    const step={ArrowUp:-1,ArrowDown:1,PageUp:-5,PageDown:5}[e.key];

async function requestLock(){ try{ if('wakeLock' in navigator) wo.lock=await navigator.wakeLock.request('screen'); }catch(e){} }
function releaseLock(){ try{ wo.lock&&wo.lock.release(); }catch(e){} wo.lock=null; }
function ensureAudio(){ try{ if(!wo.ac){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) wo.ac=new AC(); } if(wo.ac&&wo.ac.state==='suspended') wo.ac.resume(); }catch(e){} }
function beep(){
  try{ navigator.vibrate&&navigator.vibrate([120,80,120]); }catch(e){}
  if(!state.sound||!wo.ac) return;
  try{ const ac=wo.ac; [0,0.22].forEach(t0=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,ac.currentTime+t0); g.gain.exponentialRampToValueAtTime(0.22,ac.currentTime+t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+t0+0.18);
    o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t0); o.stop(ac.currentTime+t0+0.2); }); }catch(e){}
}
function stopTimer(){ if(wo.timer){ clearInterval(wo.timer); wo.timer=null; } }
function runTimer(done){

  wo.timer=setInterval(()=>{ wo.left=Math.max(0,Math.ceil((wo.end-Date.now())/1000)); updateRing(); if(wo.left<=0){ stopTimer(); done(); } },200);

function updateRing(){

document.addEventListener('click',e=>{

      if(a==='weight-save') store.set(K.weight(key),v); else store.del(K.weight(key));
      afterWeight(); if(after) after(); else closeSheet();
      toast(a==='weight-save'?label+' '+v.toFixed(1)+'kg 저장':label+' 기록을 지웠습니다',()=>{ if(prevV==null) store.del(K.weight(key)); else store.set(K.weight(key),prevV); afterWeight(); if(after&&document.getElementById('ds-'+i)) after(); });
      return;
    }
    if(a==='steps-pick'){ stepsSheet(); return; }
    if(a==='steps-save'&&pk&&pk.kind==='steps'){
      const v=pk.n, prev=state.steps; state.steps=v; saveToday(); closeSheet(); refreshToday(); if(state.view==='workout'){renderWorkout();icons();}
      toast(v>=stepsGoal?'걸음 '+fmt(v)+'보 · 오늘 목표 달성':'걸음 '+fmt(v)+'보 저장',()=>{ state.steps=prev; saveToday(); refreshToday(); if(state.view==='workout'){renderWorkout();icons();} }); return;
    }
    if(a==='steps-add'){ state.steps=Math.min(99999,state.steps+1000); saveToday(); refreshToday(); if(state.view==='workout'){renderWorkout();icons();} return; }
    if(a==='backup-paste'){
      const ta=$('#backup-in'), msg=$('#backup-msg');
      if(navigator.clipboard&&navigator.clipboard.readText) navigator.clipboard.readText().then(x=>{ if(ta) ta.value=(x||'').trim(); if(msg) msg.textContent=x?'붙여넣었습니다. 불러오기를 누르세요':'클립보드가 비어 있습니다'; }).catch(()=>{ if(msg) msg.textContent='입력칸을 길게 눌러 붙여넣으세요'; ta&&ta.focus(); });
      else { if(msg) msg.textContent='입력칸을 길게 눌러 붙여넣으세요'; ta&&ta.focus(); }
      return;
    }
    if(a==='backup-copy'){
      let code='';
      try{ const o={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.indexOf('dp:')===0) o[k]=localStorage.getItem(k); } code=btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }catch(err){}
      const fallback=()=>{ openSheet(sheetHead('백업','백업 코드')+`<p class="note" style="margin-top:8px">아래 코드를 길게 눌러 전체 복사하세요.</p><textarea class="input" id="backup-out" style="margin-top:14px" readonly spellcheck="false" aria-label="백업 코드">${code}</textarea>`); const ta=$('#backup-out'); if(ta){ ta.focus(); ta.select(); } };
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(()=>toast('백업 코드를 복사했습니다')).catch(fallback); else fallback();
      return;
    }
    if(a==='backup-open'){ backupSheet(); return; }
    if(a==='backup-import'){
      const ta=$('#backup-in'), msg=$('#backup-msg'); const code=(ta&&ta.value||'').trim(); if(!code){ if(msg) msg.textContent='백업 코드를 먼저 붙여넣으세요'; return; }
      if(!t.dataset.armed){ t.dataset.armed='1'; t.textContent='덮어쓰려면 한 번 더'; if(msg) msg.textContent='지금 기기의 같은 날짜 기록이 바뀝니다'; return; }
      try{ const o=JSON.parse(decodeURIComponent(escape(atob(code)))); Object.keys(o).forEach(k=>{ if(k.indexOf('dp:')===0) localStorage.setItem(k,o[k]); }); location.reload(); }
      catch(err){ t.textContent='불러오기'; delete t.dataset.armed; if(msg) msg.textContent='코드가 올바르지 않습니다. 다시 복사해서 붙여넣으세요'; }
      return;
    }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(wo.open) woClose(); else closeSheet(); return; }
  if((e.metaKey||e.ctrlKey)&&e.key==='\\'){ e.preventDefault(); toggleSide(); return; }
  if(!pk||!sheet.classList.contains('open')) return;
  const onCtl=e.target.closest&&e.target.closest('button,textarea,a');
  if(e.key==='Enter'&&!onCtl){ const b=sheet.querySelector('[data-pk-save]'); if(b){ e.preventDefault(); b.click(); } return; }
  if(pk.kind==='steps'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){
    if(/^\d$/.test(e.key)){ e.preventDefault(); padKey(e.key); }
    else if(e.key==='Backspace'){ e.preventDefault(); padKey('b'); }
  }
});
scrim.addEventListener('click',()=>{ if(sheet.classList.contains('open')) closeSheet(); });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(h&&h!==state.view) go(h); });
if(mqPhone.addEventListener) mqPhone.addEventListener('change',()=>{ if(!mqPhone.matches) closeSheet(); });

/* live clock text: updates labels only, never re-renders */
function tick(){
  const n=new Date();
  if(keyOf(new Date(n.getFullYear(),n.getMonth(),n.getDate()))!==dayKey&&!wo.open){ location.reload(); return; }
  document.querySelectorAll('[data-at]').forEach(el=>{ el.textContent=relText(+el.getAttribute('data-at')); });
  document.querySelectorAll('[data-deadline]').forEach(el=>{ el.innerHTML=deadlineText(); });
}
setInterval(tick,30000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ tick(); if(wo.open&&wo.lock==null) requestLock(); } });

/* boot */
const h=location.hash.slice(1); if(RENDER[h]) state.view=h;
renderAll(); applySide();
if(!window.lucide) window.addEventListener('load',icons);
if('serviceWorker' in navigator&&location.protocol==='https:'){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); }); }
})();
</script>
